<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>POLESHIFT 폴시프트 — MAGNETIC PUZZLE</title>
<style>
:root{--bg:#04060f;--navy:#0b1430;--panel:#0f1a3a;--cy:#22e6ff;--mg:#ff3bd4;--gold:#ffc940;--tx:#e8eeff;--mut:#9aa7d1;
--blue:#3b82ff;--red:#ff4b5c;--yellow:#ffd23a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:16px;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 30%,#101c46 0%,#060a1c 55%,#020308 100%)}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:1;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.screen.on{display:flex}
button{font:inherit;font-weight:700;color:var(--tx);background:var(--panel);border:2px solid #2b3a72;border-radius:14px;padding:12px 16px;min-height:48px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.38;cursor:not-allowed}
button.pri{background:linear-gradient(135deg,#0c5f7a,#0b2f66);border-color:var(--cy)}
button.mg{background:linear-gradient(135deg,#6a1564,#2c1050);border-color:var(--mg)}
button.gold{border-color:var(--gold);color:var(--gold)}
/* menu */
#menu{justify-content:center;gap:12px}
.logo{display:flex;flex-direction:column;align-items:center;margin-bottom:14px}
.logo .word{font-size:clamp(38px,11vw,64px);font-weight:900;letter-spacing:.08em;background:linear-gradient(90deg,var(--cy),#fff 50%,var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .sub{letter-spacing:.45em;color:var(--cy);font-size:14px;font-weight:700}
.logo .kr{color:var(--mut);font-size:15px;margin-top:4px}
.slogan{color:var(--gold);font-size:13px;letter-spacing:.12em;text-align:center}
.menuBtns{display:flex;flex-direction:column;gap:10px;width:min(320px,86vw)}
.rec{color:var(--mut);font-size:15px;text-align:center}
/* game */
#game{padding-top:max(6px,env(safe-area-inset-top))}
.hud{display:flex;gap:6px;width:100%;max-width:560px;align-items:stretch}
.stat{flex:1;background:rgba(15,26,58,.85);border:1px solid #2b3a72;border-radius:12px;padding:4px 6px;text-align:center}
.stat b{display:block;font-size:19px}
.stat span{font-size:12px;color:var(--mut)}
.hud button{min-height:44px;padding:6px 10px;font-size:15px}
#boardWrap{flex:1;width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#board{touch-action:manipulation;user-select:none}
.ctrl{width:100%;max-width:560px;display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px;align-items:center}
.preview{display:flex;gap:6px;align-items:center;background:rgba(15,26,58,.85);border:1px solid #2b3a72;border-radius:12px;padding:4px 8px}
.preview small{color:var(--mut);font-size:12px;display:block;text-align:center}
.ctrl button{padding:8px 4px;font-size:15px}
#hint{width:100%;max-width:560px;font-size:14px;color:var(--mut);text-align:center;min-height:40px;padding:4px 2px 8px;line-height:1.35}
#formula{font-size:12px;color:#7d8bbb;text-align:center;max-width:560px}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(2,4,12,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.card{background:linear-gradient(160deg,#121f48,#0a1128);border:2px solid #2b3a72;border-radius:20px;padding:18px;width:min(440px,100%);max-height:92vh;overflow:auto}
.card h2{margin:0 0 10px;color:var(--cy);font-size:22px}
.card p,.card li{line-height:1.5;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row button{flex:1}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #22305e;font-size:16px}
.tog button{min-width:90px}
/* toast/combo */
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:30;pointer-events:none;text-align:center}
.tmsg{background:rgba(10,16,40,.92);border:2px solid var(--cy);border-radius:14px;padding:8px 16px;margin:4px;font-weight:800;font-size:18px;animation:pop .9s ease forwards}
.tmsg.gold{border-color:var(--gold);color:var(--gold)}
@keyframes pop{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
body.rm .tmsg{animation:none}
/* gallery */
#gallery{padding-top:12px;overflow:auto}
#gallery h1{margin:4px 0;font-size:24px;color:var(--gold);letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%;max-width:640px;padding-bottom:12px}
.gcard{border-radius:16px;border:2px solid #2b3a72;background:#0b1430;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;padding:0;text-align:left;font-weight:400}
.gcard.un{border-color:var(--gold);box-shadow:0 0 12px rgba(255,201,64,.35)}
.gimg{aspect-ratio:3/4;width:100%;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gimg img{width:100%;height:100%;object-fit:cover;display:block}
.gimg .lock{position:absolute;font-size:34px}
.ginfo{padding:8px;font-size:13px;line-height:1.35}
.ginfo b{font-size:15px;display:block}
.bar{height:8px;background:#1b264e;border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg))}
.unlockAnim{animation:unl 1.2s ease}
@keyframes unl{0%{transform:scale(.6) rotate(-6deg);opacity:0}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}
body.rm .unlockAnim{animation:none}
#zoomImg{width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden}
/* tutorial */
#tutPanel{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:25;display:none;background:linear-gradient(160deg,#16265a,#0a1230);border:2px solid var(--gold);border-radius:18px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.6);max-width:560px;margin:0 auto}
#tutPanel.on{display:block}
#tutPanel .tstep{font-size:13px;color:var(--gold);font-weight:800;letter-spacing:.05em}
#tutPanel .ttext{font-size:17px;line-height:1.45;margin:6px 0 10px}
#tutPanel .trow{display:flex;gap:8px}#tutPanel .trow button{flex:1;min-height:46px;font-size:16px}
.tutGlow{box-shadow:0 0 0 3px #ffc940,0 0 18px rgba(255,201,64,.8)!important;animation:tg 1.1s ease-in-out infinite}
@keyframes tg{50%{box-shadow:0 0 0 5px #ffc940,0 0 26px rgba(255,201,64,1)}}
body.rm .tutGlow{animation:none}
body.tut #toast{top:52%}
@media (max-height:700px){.stat b{font-size:16px}.ctrl button{min-height:44px}#formula{display:none}}
</style>

<script id="config">
var POLESHIFT_CONFIG = {
  // ---- 점수 ----

  MAX_PULSES: 3,              // 한 턴 자기장 펄스 최대 횟수
  MAX_CHAIN: 10,              // 연쇄 최대 단계
  MIN_CLEAR: 3,               // 소거 최소 연결 수
  EASY_TURNS: 8,              // 이 턴 수까지는 2색/단순 공급
  // ---- 갤러리 해금 조건 ----

  REWARDS: [
    { id: 'r1', title: 'Nebula Muse',     cond: { type: 'totalScore', value: 1000 } },

  ]
};

   src 에 이미지 경로/URL을 넣으면 해금 후 표시됩니다. 비어 있거나 로드 실패 시
   자체 제작 추상 카드(SVG)로 자동 대체됩니다.
   콘텐츠 정책(README 참조): 명확한 성인(25세 이상) 여성의 비노골적 패션 화보
   스타일만 사용. 성적 행위/노출 묘사 금지. 이미지 생성 API 키를 이 파일에 넣지 마세요. */
var POLESHIFT_GALLERY_IMAGES = [
  { rewardId: 'r1', src: '', alt: 'Nebula Muse 화보', hue: 200 },
  { rewardId: 'r2', src: '', alt: 'Cyan Horizon 화보', hue: 185 },

<!-- =====================================================================
     [LOGIC] 순수 게임 규칙 모듈 — DOM 의존 없음 (Node 테스트에서 그대로 로드)
     ===================================================================== -->
<script id="logic">
(function (root) {
  'use strict';
  var RINGS = 3, SLOTS = 12, N_POS = RINGS * SLOTS;
  var COLORS = ['blue', 'red', 'yellow'];

  /* ---------- 위치 / 인접 ----------
     위치 인덱스 p = ring*12 + slot (ring 0 = 안쪽). 모든 궤도가 12칸이므로
     "같은 각도"의 인접 궤도 칸은 같은 slot 이다. 같은 궤도는 slot±1 (원형 연결). */
  function pos(r, s) { return r * SLOTS + ((s % SLOTS) + SLOTS) % SLOTS; }
  function ringOf(p) { return Math.floor(p / SLOTS); }
  function slotOf(p) { return p % SLOTS; }
  function valid(p) { return Number.isInteger(p) && p >= 0 && p < N_POS; }
  var ADJ = [];
  for (var p0 = 0; p0 < N_POS; p0++) {
    var r = ringOf(p0), s = slotOf(p0), a = [pos(r, s - 1), pos(r, s + 1)];
    if (r > 0) a.push(pos(r - 1, s));
    if (r < RINGS - 1) a.push(pos(r + 1, s));
    ADJ.push(a.sort(function (x, y) { return x - y; }));
  }
  /* 원형 거리: 궤도 차 + 원형 슬롯 차 (그래프 최단거리와 동일) */
  function dist(a, b) {
    var ds = Math.abs(slotOf(a) - slotOf(b)); ds = Math.min(ds, SLOTS - ds);
    return Math.abs(ringOf(a) - ringOf(b)) + ds;
  }

  /* ---------- 시드 RNG (mulberry32) — 상태는 정수 하나라 직렬화/재현 가능 ---------- */
  function rngNext(state) {
    var t = (state.rng = (state.rng + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  /* ---------- 상태 ----------
     cells[p] = 원 id 또는 null, circles[id] = {id,color,pol,ring,slot} */
  function createGame(seed, cfg) {
    var st = {
      cfg: cfg, seed: seed >>> 0, rng: seed >>> 0, nextId: 1, turn: 0,
      cells: new Array(N_POS).fill(null), circles: {},
      score: 0, combo: 0, maxCombo: 0, over: false, overReason: '', current: null, next: null
    };
    st.current = genPiece(st); st.next = genPiece(st);
    return st;
  }
  function clone(st) { return JSON.parse(JSON.stringify(st)); }
  /* 공급 규칙: EASY_TURNS 까지는 파랑/빨강 + 극성 N 위주, 이후 3색 × N/S 무작위 */
  function genPiece(st) {
    var easy = st.turn < st.cfg.EASY_TURNS;
    var color = easy ? COLORS[Math.floor(rngNext(st) * 2)] : COLORS[Math.floor(rngNext(st) * 3)];
    var pol = easy ? (rngNext(st) < 0.75 ? 'N' : 'S') : (rngNext(st) < 0.5 ? 'N' : 'S');
    return { color: color, pol: pol };
  }
  function emptyPositions(st) { var o = []; for (var p = 0; p < N_POS; p++) if (st.cells[p] === null) o.push(p); return o; }
  function addCircle(st, p, color, pol) {
    if (!valid(p) || st.cells[p] !== null) return null;
    var id = st.nextId++;
    st.circles[id] = { id: id, color: color, pol: pol, ring: ringOf(p), slot: slotOf(p) };
    st.cells[p] = id; return id;
  }
  function posOfId(st, id) { var c = st.circles[id]; return pos(c.ring, c.slot); }
  function sortedIds(st) { return Object.keys(st.circles).map(Number).sort(function (a, b) { return a - b; }); }

  /* ---------- 자기장 이동 계산 ----------
     sources: 기준 원(배치/전환된 원) id 목록. 기준 원은 고정(앵커).
     각 펄스:
       1) 현재 상태의 '복사본(snapshot)'에서만 읽는다.
       2) 기준 원으로부터 거리 ≤ 2 인 원들을 (거리, id) 순으로 정렬해 처리 순서를 고정.
       3) 반대 극성 → 기준과의 거리를 줄이는 빈 인접칸, 같은 극성 → 거리를 늘리는 빈 인접칸을 후보로.
          (여러 기준이 있으면 첫 번째로 영향 준 가장 가까운 기준을 사용)
       4) 후보 정렬: 목표(기준)까지의 원형 거리(인력: 오름차순 / 반발: 내림차순) → 같은 궤도 이동 우선 → 위치 번호.
       5) 충돌 판정: snapshot 에서 비어 있고, 이번 펄스에 다른 원이 선점하지 않은 칸만 허용.

  /* ---------- UI 애니메이션: 로직이 낸 이벤트를 순서대로 재생 ----------

  function wait(ms) { return new Promise(function (r) { setTimeout(r, settings.rm ? Math.min(ms, 60) : ms); }); }
  function animateMoves(moves, tok) {
    return new Promise(function (resolve) {
      if (!moves.length) return resolve();
      var dur = settings.rm ? 1 : 260, t0 = performance.now();
      var from = moves.map(function (m) { return xy(m.from); }), to = moves.map(function (m) { return xy(m.to); });

      function frame(now) {

        var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        fx = moves.map(function (m, i) {
          var c = display.circles[m.id], x = from[i][0] + (to[i][0] - from[i][0]) * e, y = from[i][1] + (to[i][1] - from[i][1]) * e;
          return circleSVG(x, y, geo.cr, c.color, c.pol);

        else { moves.forEach(function (m) { display.cells[m.to] = m.id; display.circles[m.id].ring = L.ringOf(m.to); display.circles[m.id].slot = L.slotOf(m.to); }); fx = []; render(); resolve(); }
      }
      requestAnimationFrame(frame);
    });
  }
  async function playEvents(events) {
    var tok = animToken;

      if (tok !== animToken) return;
      var ev = events[i];
      if (ev.type === 'place') { var cc = G.circles[ev.id] || { color: display && 'blue', pol: 'N' }; display.circles[ev.id] = { id: ev.id, color: findColor(events, ev.id), pol: findPol(events, ev.id), ring: L.ringOf(ev.at), slot: L.slotOf(ev.at) }; display.cells[ev.at] = ev.id; render(); await wait(140); }
      else if (ev.type === 'flip') { display.circles[ev.id].pol = ev.to; var q = xy(L.posOfId(display, ev.id)); fx = ['<circle cx="' + q[0] + '" cy="' + q[1] + '" r="' + geo.cr * 2.2 + '" fill="none" stroke="#ff3bd4" stroke-width="3" opacity=".7"/>']; render(); await wait(200); fx = []; }

      }
      else if (ev.type === 'settle') { await animateMoves(ev.moves, tok); }
      else if (ev.type === 'clear') {
        fx = ev.ids.map(function (id) { var q = xy(L.posOfId(display, id)); return '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="' + geo.cr * 1.4 + '" fill="none" stroke="#fff" stroke-width="4"/>'; });

        ev.ids.forEach(function (id) { var p = L.posOfId(display, id); display.cells[p] = null; delete display.circles[id]; });
        fx = []; display.score = (display.score || 0) + ev.points; $('hScore').textContent = display.score.toLocaleString(); $('hCombo').textContent = ev.combo; render(); await wait(120);
      }

    { text: '② 좋아요! 이제 반짝이는 <b>🚀 발사</b> 버튼을 누르세요.', act: 'fire' },
    { text: '③ <b>자기장 반응!</b><br>• 극성이 <b>반대(N↔S)</b>인 빨강 S는 <b>끌려왔고</b><br>• 극성이 <b>같은(N↔N)</b> 빨강 N은 <b>밀려났어요</b>.<br>놓은 원에서 2칸 이내의 원이 한 번에 1칸씩, 최대 3번 움직여요.', next: true },
    { text: '④ 이번엔 <b>이미 놓인 원</b>을 골라요. 화살표가 가리키는 <b>파랑 N</b> 원을 탭하세요.', tapCircle: 13 },
    { text: '⑤ 반짝이는 <b>⇅ 극성 전환</b>을 누르세요. N이 S로 바뀌면서 주변 원이 다시 움직여요.', act: 'flip' },
    { text: '⑥ 파랑이 <b>S</b>가 되자 이웃한 <b>같은 극성 빨강 S</b>가 밀려났어요. 자기장은 <b>2칸 이내</b>에만 미쳐서 멀리 있는 빨강 N은 그대로예요.<br>한 턴에는 <b>발사 또는 극성 전환 중 하나만</b> 할 수 있어요.', next: true },
    { text: '⑦ 이제 소거! 바깥 궤도에 <b>노랑 2개</b>가 붙어 있어요. 현재 원은 <b>노랑 N</b>. 화살표가 가리키는 칸을 탭하세요.', tap: 32, piece: { color: 'yellow', pol: 'N' } },
    { text: '⑧ <b>🚀 발사</b>! 같은 색 3개가 이어지면 사라져요.', act: 'fire' },
    { text: '⑨ <b>소거 성공! +300점</b><br>같은 색이 옆 칸이나 안/바깥 궤도 같은 각도로 <b>3개 이상</b> 이어지면 사라져요. 극성은 상관없어요.', next: true },
    { text: '⑩ <b>콤보와 점수</b><br>소거 후 남은 원은 코어 쪽으로 당겨지고, 새로 이어지면 <b>연쇄 콤보</b>! 콤보가 오를수록 배율 ↑ (×1.5, ×2…). 4개 이상 한 번에 지우면 보너스!<br><b>36칸이 모두 차면 게임 오버</b>예요. 이제 실전을 시작해요!', next: true, last: true }
  ];
  function startTutorial(thenPlay) {
    animToken++; busy = false; paused = false; sel = null; fx = [];
    closeAll(); show('game');
    G = L.createGame(20261028, CFG);
    [[12, 'red', 'N'], [15, 'red', 'S'], [30, 'yellow', 'S'], [31, 'yellow', 'S']].forEach(function (a) { L.addCircle(G, a[0], a[1], a[2]); });
    TUT = { step: 0, thenPlay: !!thenPlay };
    display = L.clone(G); layout(); tutShow(); updateHud();
  }
  function tutCur() { return TUT_STEPS[TUT.step]; }
  function tutShow() {
    var st = tutCur();
    if (st.piece) { G.current = { color: st.piece.color, pol: st.piece.pol }; }
    $('tutStep').textContent = '튜토리얼 ' + (TUT.step + 1) + ' / ' + TUT_STEPS.length;
    $('tutText').innerHTML = st.text;
    $('tutNext').style.display = st.next ? '' : 'none';
    $('tutNext').textContent = st.last ? (TUT.thenPlay ? '게임 시작!' : '완료') : '다음';
    $('tutPanel').classList.add('on'); document.body.classList.add('tut');
    render();
  }
  function tutGo() { TUT.step++; tutShow(); }
  function tutTap(p) {
    var st = tutCur();
    if (st.tap != null && p === st.tap && G.cells[p] === null) { sel = { kind: 'empty', p: p }; audio(); tutGo(); }
    else if (st.tapCircle != null && p === st.tapCircle && G.cells[p] !== null) { sel = { kind: 'circle', p: p }; audio(); tutGo(); }
  }
  function tutButtons() {
    var st = tutCur(), ok = !busy && !paused && sel;
    $('btnFire').disabled = !(ok && st.act === 'fire'); $('btnFlip').disabled = !(ok && st.act === 'flip'); $('btnCancel').disabled = true;
    $('btnFire').classList.toggle('tutGlow', !$('btnFire').disabled); $('btnFlip').classList.toggle('tutGlow', !$('btnFlip').disabled);
  }
  function tutHighlight() {
    var st = tutCur(), p = st.tap != null ? st.tap : st.tapCircle;
    if (p == null || busy) return '';
    var c = xy(p), r = geo.cr, ax = c[0], ay = c[1] - r - 8;
    return '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + (r + 7) + '" fill="none" stroke="#ffc940" stroke-width="4"/>' +
      '<polygon points="' + ax + ',' + ay + ' ' + (ax - 11) + ',' + (ay - 20) + ' ' + (ax + 11) + ',' + (ay - 20) + '" fill="#ffc940" stroke="#0b1430" stroke-width="2"/>';
  }
  function tutAfterTurn() { if (TUT && tutCur().act) tutGo(); }
  function tutFinish(skipped) {
    var then = TUT && TUT.thenPlay; Store.set('tutorialSeen', true);
    TUT = null; $('tutPanel').classList.remove('on'); document.body.classList.remove('tut'); ['btnFire', 'btnFlip'].forEach(function (b) { $(b).classList.remove('tutGlow'); });
    if (then) newGame(); else { G = null; display = null; show('menu'); }
  }
  $('tutNext').onclick = function () { if (!TUT) return; if (tutCur().last) tutFinish(false); else tutGo(); };
  $('tutSkip').onclick = function () { if (TUT) tutFinish(true); };
  $('btnTut').onclick = function () { audio(); startTutorial(false); };
  $('pTut').onclick = function () { startTutorial(false); };

  /* Android 뒤로 가기 처리: 처리했으면 true, 앱 종료해야 하면 false */
  window.poleshiftBack = function () {
    var ovs = ['ovZoom', 'ovSettings', 'ovRules', 'ovPause'];
    for (var i = 0; i < ovs.length; i++) if ($(ovs[i]).classList.contains('on')) { if (ovs[i] === 'ovPause') $('pResume').onclick(); else $(ovs[i]).classList.remove('on'); return true; }
    if ($('ovOver').classList.contains('on')) { $('oMenu').onclick(); return true; }
    if ($('gallery').classList.contains('on')) { $('galBack').onclick(); return true; }
    if (TUT) { tutFinish(true); return true; }
    if ($('game').classList.contains('on')) { $('pMenu').onclick(); return true; }
    return false;
  };
  window.addEventListener('resize', function () { drawStars(); if ($('game').classList.contains('on')) { layout(); render(); } });
  drawStars(); drawSettings(); menuRefresh();
  // 재현 가능한 테스트용: URL ?seed=123 이면 해당 시드로 시작 (디버그 UI 노출 없음)
  var m = /[?&]seed=(\d+)/.exec(location.search); if (m) $('btnStart').onclick = function () { audio(); if (!Store.get('tutorialSeen', false)) startTutorial(true); else newGame(+m[1]); };
})();
</script>
</body>
</html>
